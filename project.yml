# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: TollCalc
options:
  bundleIdPrefix: com.tollcalc
  deploymentTarget:
    iOS: "17.0"
packages:
  TollKit:
    path: .
targets:
  TollCalc:
    type: application
    platform: iOS
    sources:
      - App/TollCalc
    dependencies:
      - package: TollKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tollcalc.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TollCalc
